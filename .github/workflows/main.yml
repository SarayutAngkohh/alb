name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # ปุ่มกดสั่ง Build ด้วยตัวเองบนเว็บ GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Gradle Wrapper if Missing
      run: |
        if [ ! -f "gradlew" ]; then
          echo "gradlew not found, generating one automatically..."
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
        else
          chmod +x gradlew
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AlongTheBooks-MVP-APK
        path: app/build/outputs/apk/debug/app-debug.apk
